[package]
name = "qualia2fa-ffi"
version = "0.4.1"
edition = "2024"
description = "Qualia2FA FFI layer: exposes qualia2fa-core as UniFFI bindings for Kotlin and Swift"
license = "LGPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/Qualia2FA/Qualia2FA-FFI"
readme = "README.en.md"
# CI configuration and the dependency audit manifest are not part of the published
# package: they are meaningless to users, and the size and contents of a crates.io
# package are publicly visible.
exclude = ["/.github", "/deny.toml"]

# This crate must **not** enable `#![forbid(unsafe_code)]`.
#
# `uniffi::setup_scaffolding!()` expands the unsafe code required at the FFI
# boundary: raw pointer dereference, `catch_unwind`, string ownership transfer.
# The boundary is inherently unsafe.
#
# Soundness rests on the generated UniFFI code and on the `Result` return
# convention, so the safety boundary is drawn between crates, not modules:
#   - qualia2fa-core: no I/O, no unsafe (`forbid(unsafe_code)`), auditable alone
#   - qualia2fa-ffi : the only place unsafe is allowed, marshalling logic only
# No cryptography or parsing logic belongs in this crate.
#
# `unsafe_code = "warn"` keeps new unsafe code visible; CI raises it to an error
# with `-D warnings`.
[lints.rust]
unsafe_code = "warn"

[lib]
# cdylib is loaded dynamically by the JVM (JNA), Android and iOS; staticlib
# serves iOS static linking and single-artifact builds. Both are produced.
#
# No rlib is produced, so integration tests under `tests/` cannot link this crate:
# all tests are `#[cfg(test)] mod tests` inside `src/lib.rs`.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# A version dependency on the core library, which is published on crates.io as
# `qualia2fa-core`. Local builds, CI and third-party consumers therefore
# resolve the same source, and this repository checks nothing out: the nested
# `Core/` submodule was removed together with the path dependency.
#
# 0.2.1 is the first release that can write an export, and it is also the one whose HTML reader
# takes the time step out of the QR code an export draws - so the export screen and the import
# preview of an HTML file both need it. 0.3.0 is the floor because the tree of groups and the
# icon node only exist there; an FFI build against anything older would not compile at all, and
# letting the resolver pick an older core would only turn a compile error into a confusing
# version conflict. Its HTML export still spells the cells the way Aegis does.
qualia2fa-core = "0.4.1"

# The code channel and the LAN channel. The host draws a pairing payload (or an entry) as a
# QR code and reads one back from an image the user imported; and the LAN half — multicast
# discovery plus an iroh endpoint — is wrapped by this crate as an `FfiTransport` of its own,
# because iroh is Rust-only and no host-side implementation could reach it.
#
# The default features are on deliberately: they carry `scan-image`, the decoding half, and the
# desktop application needs both halves. Decoding takes pixels rather than an image file, so
# the image format decoders stay on the platform side.
#
# `iroh-lan` is on because the LAN channel is part of this crate's surface. It brings iroh, a
# tokio runtime and their tree (about 250 crates) into every build of this library, the Android
# one included. The transport crate keeps it optional so that a build with no use for the data
# plane can leave it out; this one has a use for it on every platform it serves.
#
# 0.1.3 is the first version that reports the address a lobby announcement arrived from. That
# address is the only one a discovered peer can be dialed at, so 0.1.2 and older would leave a
# peer discoverable and unreachable.
qualia-transport = { version = "0.1.6", features = ["iroh-lan"] }

# Device identity: the `DevicePublicKey` / `DeviceSignature` types live here.
#
# The host callbacks (`FfiDeviceKeys::get_or_create` / `sign`) return raw bytes.
#
# The FFI layer converts those bytes into the types above. Core re-exports them
# so that callers depending on Core alone need one dependency less; this crate
# uses the original types directly, since the callback signatures are clearer
# with them.
#
# A version requirement, matching the version Core uses.
#
# 0.1.2 is the first release carrying the application's master key store in
# both of its forms (`DirectMasterKeyStore` / `WrappedMasterKeyStore`), which
# the objects of this crate are built on. The requirement names that release
# rather than the `0.1` line: under `0.1` a lockfile that already holds 0.1.1
# keeps it, and the build then fails on a missing type instead of resolving
# the version this crate was written against.
#
# The crate is published on crates.io, which puts local, CI and third-party
# consumers on the same source. Both this crate and Core depend on it directly.
qualia-dik = "0.1.3"

# Platform auth-bound key store: the second unlock path (`master.key.bio`).
#
# A version requirement, like the two above: the crate is published on crates.io,
# so local, CI and third-party consumers resolve the same source. 0.1.0 is the first
# release carrying the Windows backend and the host-sealer seam the application uses.
qualia-bioauth = "0.1.0"

# Provides the `Display` and `std::error::Error` implementations of `FfiError`.
# Same major as the version Core uses (2.0.21), so no duplicate version.
thiserror = "2"

# UniFFI version policy:
#
# Pinned to an exact patch, not to the `0.29` line: the application-side binding
# generator Gobley 0.3.7 (2025-10-08, its newest release) generates its bindings
# against 0.29.4, and the Rust and Kotlin scaffolding must be the same patch
# release or the generated serialization format differs. A caret requirement
# would resolve to 0.29.5 from the registry, which is that mismatch.
#
# The `cli` feature provides `uniffi::uniffi_bindgen_main`, used by
# `src/bin/uniffi-bindgen.rs`. It must sit in `[dependencies]`, not in
# `[dev-dependencies]`: dev-dependency features apply to test, example and
# bench targets only, never to targets under `src/bin/`, so in the dev
# section the entry point is missing and `cargo build --bin uniffi-bindgen`
# finds no `uniffi_bindgen_main`.
#
# clap and camino therefore enter this crate's dependency tree for that binary
# only, and are not linked into cdylib/staticlib.
uniffi = { version = "=0.29.4", features = ["cli"] }

[dev-dependencies]
# The tests need a real ECDSA P-256 implementation to play the host device
# identity, and a SHA-256 to derive test private keys deterministically.
#
# `p256 0.14` matches the version Core pins; 0.13 depends on `sha2 ^0.10` and
# would pull in a second SHA-2. Staying on the same version keeps the tests on
# the production code path and the lockfile down to one `p256`/`sha2`.
#
# Both are test-target only and are not linked into cdylib/staticlib.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"

# The in-memory software backend of the device identity kit, so that the master
# key store tests can drive both forms of this boundary on every platform: a
# real platform store exists on Windows and Android only, and a test that skips
# wherever there is none pins nothing about the marshalling.
#
# Test-target only. `mock` is off by default in `qualia-dik` precisely so that a
# production build cannot carry a key store path with no hardware protection,
# and the library targets of this crate never enable it.
qualia-dik = { version = "0.1.3", features = ["mock"] }

